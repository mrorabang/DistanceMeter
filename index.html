    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {

    // Định dạng ngày giờ chuyến đi (VD: 16/10/2026 14:45:30)
    function formatTripDate(d = new Date()) {
      const pad = (n) => n.toString().padStart(2, '0');
      const day = pad(d.getDate());
      const month = pad(d.getMonth() + 1);
      const year = d.getFullYear();
      const hours = pad(d.getHours());
      const minutes = pad(d.getMinutes());
      const seconds = pad(d.getSeconds());
      return `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;
    }

    // =========================================================================
    // HÀM TẠO ẢNH SNAPSHOT LỘ TRÌNH GPS (CANVAS CLIENT-SIDE -> BASE64 DATA URL)
    // =========================================================================
    function generateRouteSnapshot(coords, width = 540, height = 320, options = {}) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      // 1. Nền bản đồ tối sang trọng
      const bgGrad = ctx.createLinearGradient(0, 0, width, height);
      bgGrad.addColorStop(0, '#090d16');
      bgGrad.addColorStop(1, '#0f172a');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // 2. Lưới toạ độ bản đồ (Grid lines)
      ctx.strokeStyle = 'rgba(51, 65, 85, 0.35)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      const gridSize = 45;
      for (let x = gridSize; x < width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = gridSize; y < height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      const validCoords = (coords && coords.length > 0) ? coords : [];

      if (validCoords.length === 0) {
        // Chưa có toạ độ -> Vẽ radar tâm
        ctx.fillStyle = '#06b6d4';
        ctx.beginPath();
        ctx.arc(width / 2, height / 2, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(width / 2, height / 2, 32, 0, Math.PI * 2);
        ctx.stroke();
      } else if (validCoords.length === 1) {
        // 1 toạ độ GPS
        const cx = width / 2;
        const cy = height / 2;
        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.arc(cx, cy, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('A', cx, cy);
      } else {
        // Nhiều toạ độ -> Tính bounding box và vẽ đường lộ trình
        let minLat = Infinity, maxLat = -Infinity;
        let minLng = Infinity, maxLng = -Infinity;
        validCoords.forEach(p => {
          if (p.lat < minLat) minLat = p.lat;
          if (p.lat > maxLat) maxLat = p.lat;
          if (p.lng < minLng) minLng = p.lng;
          if (p.lng > maxLng) maxLng = p.lng;
        });

        const dLat = Math.max(maxLat - minLat, 0.0004);
        const dLng = Math.max(maxLng - minLng, 0.0004);
        const padX = 60;
        const padY = 55;

        const toScreen = (p) => {
          const x = padX + ((p.lng - minLng) / dLng) * (width - 2 * padX);
          const y = height - (padY + ((p.lat - minLat) / dLat) * (height - 2 * padY));
          return { x, y };
        };

        // Lớp phát quang xanh ngọc (Cyan glow)
        ctx.save();
        ctx.shadowColor = 'rgba(6, 182, 212, 0.85)';
        ctx.shadowBlur = 12;
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 5.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        validCoords.forEach((p, idx) => {
          const pt = toScreen(p);
          if (idx === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();
        ctx.restore();

        // Lớp đường polyline sáng bên trong
        ctx.strokeStyle = '#67e8f9';
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        validCoords.forEach((p, idx) => {
          const pt = toScreen(p);
          if (idx === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();

        // Marker A (Điểm khởi hành)
        const pStart = toScreen(validCoords[0]);
        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.arc(pStart.x, pStart.y, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('A', pStart.x, pStart.y);

        // Marker B (Điểm kết thúc)
        const pEnd = toScreen(validCoords[validCoords.length - 1]);
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(pEnd.x, pEnd.y, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('B', pEnd.x, pEnd.y);
      }

      // Watermark góc trên
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.strokeStyle = 'rgba(51, 65, 85, 0.7)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(16, 14, 190, 28, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#22d3ee';
      ctx.beginPath();
      ctx.arc(28, 28, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f1f5f9';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('DistanceMeter • GPS Track', 38, 28);

      // Badge hiển thị khoảng cách và tổng tiền ở đáy ảnh
      if (options.distance !== undefined || options.totalFareFormatted !== undefined) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.strokeStyle = 'rgba(51, 65, 85, 0.8)';
        ctx.beginPath();
        ctx.roundRect(16, height - 44, width - 32, 30, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        const distText = `Lộ trình: ${options.distance !== undefined ? options.distance : '--'} km`;
        ctx.fillText(distText, 26, height - 29);

        if (options.totalFareFormatted) {
          ctx.fillStyle = '#34d399';
          ctx.font = 'bold 12px monospace';
          ctx.textAlign = 'right';
          ctx.fillText(options.totalFareFormatted, width - 26, height - 29);
        }
      }

      return canvas.toDataURL('image/png');
    }

    // =========================================================================
    // CÁC HÀM TƯƠNG TÁC VỚI FIREBASE FIRESTORE & DỰ PHÒNG LOCALSTORAGE
    // =========================================================================
    async function saveTripToDb(tripData) {
      // 1. Luôn lưu dự phòng vào localStorage của máy
      try {
        const local = JSON.parse(localStorage.getItem('distancemeter_trips') || '[]');
        const updated = [tripData, ...local.filter(t => t.stt !== tripData.stt)];
        localStorage.setItem('distancemeter_trips', JSON.stringify(updated));
      } catch (e) {
        console.warn("Lỗi lưu localStorage:", e);
      }

      // 2. Lưu vào Cloud Firestore collection 'trips'
      if (db) {
        try {
          const docRef = await db.collection('trips').add(tripData);
          return { success: true, id: docRef.id, from: 'firebase' };
        } catch (err) {
          console.warn("Lỗi ghi Cloud Firestore (dùng dữ liệu lưu máy):", err);
          return { 
            success: true, 
            id: 'local_' + Date.now(), 
            from: 'local', 
            error: err.message, 
            code: err.code || (err.message && err.message.includes('permission') ? 'permission-denied' : 'error')
          };
        }
      }
      return { success: true, id: 'local_' + Date.now(), from: 'local' };
    }

    async function fetchTripsFromDb() {
      let localTrips = [];
      try {
        localTrips = JSON.parse(localStorage.getItem('distancemeter_trips') || '[]');
      } catch (e) {
        localTrips = [];
      }

      if (!db) return { trips: localTrips, from: 'local' };

      try {
        const timeoutPromise = new Promise((_, reject) => 
          setTimeout(() => reject(new Error('Firebase timeout')), 5000)
        );
        const fetchPromise = db.collection('trips').orderBy('stt', 'desc').get();
        const snapshot = await Promise.race([fetchPromise, timeoutPromise]);

        const fbTrips = [];
        snapshot.forEach(doc => {
          fbTrips.push({ id: doc.id, ...doc.data() });
        });

        if (fbTrips.length > 0) {
          try {
            localStorage.setItem('distancemeter_trips', JSON.stringify(fbTrips));
          } catch (e) {}
          return { trips: fbTrips, from: 'firebase' };
        }
        return { trips: localTrips, from: 'firebase_empty' };
      } catch (err) {
        console.warn("Không thể tải từ Cloud Firestore (Dùng dữ liệu local):", err);
        return { 
          trips: localTrips, 
          from: 'local', 
          firebaseError: err.code || (err.message && err.message.includes('permission') ? 'permission-denied' : 'error') 
        };
      }
    }

    async function syncLocalTripsToFirebase() {
      if (!db) throw new Error("Chưa kết nối Firebase");
      const local = JSON.parse(localStorage.getItem('distancemeter_trips') || '[]');
      if (local.length === 0) return { synced: 0, total: 0, trips: [] };

      let count = 0;
      const updated = [...local];
      for (let i = 0; i < updated.length; i++) {
        const item = updated[i];
        if (!item.id || item.id.startsWith('local_')) {
          const { id, ...dataToSave } = item;
          const docRef = await db.collection('trips').add(dataToSave);
          updated[i] = { ...item, id: docRef.id };
          count++;
        }
      }
      localStorage.setItem('distancemeter_trips', JSON.stringify(updated));
      return { synced: count, total: updated.length, trips: updated };
    }

    async function deleteTripFromDb(trip) {
      try {
        const local = JSON.parse(localStorage.getItem('distancemeter_trips') || '[]');
        const filtered = local.filter(t => {
          if (trip.id && t.id === trip.id) return false;
          if (trip.stt && t.stt === trip.stt) return false;
          return true;
        });
        localStorage.setItem('distancemeter_trips', JSON.stringify(filtered));
      } catch (e) {}

      if (db) {
        try {
          if (trip.id && !trip.id.startsWith('local_')) {
            await db.collection('trips').doc(trip.id).delete();
          } else if (trip.stt) {
            const q = await db.collection('trips').where('stt', '==', trip.stt).get();
            q.forEach(doc => doc.ref.delete());
          }
        } catch (err) {
          console.warn("Lỗi xoá trên Firestore:", err);
        }
      }
    }

    // =========================================================================
    // 1. CẤU HÌNH BẢNG GIÁ CỐ ĐỊNH & BƯỚC NHẢY (STEP 0.1 KM)

    const DEFAULT_PRICING = {
      step_km: 0.1, // Bước nhảy 0.1 km

            { from_km: 10.0, to_km: null, price_per_km: 4000, description: "Từ trên 10 km trở đi" }
          ]
        }

    };

    // =========================================================================
    // 2. CÁC HÀM TÍNH TOÁN (HAVERSINE, STEP 0.1 KM, TÍNH CƯỚC BẬC THANG)
    // =========================================================================
    
    // Tính khoảng cách Haversine giữa 2 toạ độ GPS (đơn vị: km)
    function haversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371.0088; // Bán kính Trái Đất (km)
      const toRad = (x) => (x * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // Quy chuẩn số km theo bước nhảy 0.1 km (step 0.1)
    function roundToStep(distanceKm, step = 0.1, mode = "round") {
      if (!distanceKm || distanceKm <= 0) return 0.0;
      const factor = 1 / step;
      let stepped;
      if (mode === "ceil") {
        stepped = Math.ceil(distanceKm * factor) / factor;
      } else {
        stepped = Math.round(distanceKm * factor) / factor;
      }
      return Number(stepped.toFixed(1));
    }

    // Tính cước theo bảng giá bậc thang và số km quy chuẩn
    function calculateFare(distanceKm, vehicleKey, pricingConfig = DEFAULT_PRICING) {
      const vehicle = pricingConfig.vehicles[vehicleKey] || pricingConfig.vehicles.xanh_sm || Object.values(pricingConfig.vehicles)[0];
      const steppedKm = roundToStep(distanceKm, pricingConfig.step_km, pricingConfig.rounding_mode);

      const baseDist = vehicle.base_distance_km;
      const baseFare = vehicle.base_fare;

      // Giá mở cửa LUÔN được tính ngay từ khi bắt đầu chuyến (kể cả khi 0.0 km)
      let total = baseFare;
      const distInBase = Math.min(steppedKm, baseDist);
      const breakdown = [{
        stepName: `Giá mở cửa (${baseDist} km đầu)`,
        distanceKm: Number(distInBase.toFixed(1)),
        rate: baseFare,
        unit: 'đ/chuyến',
        subtotal: baseFare
      }];

      // Nếu vượt quá số km mở cửa thì tính thêm các bậc tiếp theo
      if (steppedKm > baseDist) {
        for (const tier of vehicle.tiers) {
          if (steppedKm > tier.from_km) {
            const upper = tier.to_km !== null ? Math.min(steppedKm, tier.to_km) : steppedKm;
            const distInTier = Math.max(0, upper - tier.from_km);
            if (distInTier > 0) {
              const roundedTierDist = Number(distInTier.toFixed(1));
              const sub = Math.round(roundedTierDist * tier.price_per_km);
              total += sub;
              breakdown.push({
                stepName: tier.description || `Từ ${tier.from_km} km`,
                distanceKm: roundedTierDist,
                rate: tier.price_per_km,
                unit: 'đ/km',
                subtotal: sub
              });
            }
          }
        }
      }

      return {
        vehicleName: vehicle.name,
        rawDistanceKm: Number(distanceKm.toFixed(3)),
        steppedDistanceKm: steppedKm,
        totalFare: total,
        breakdown
      };
    }

    // Định dạng tiền tệ VNĐ
    function formatVND(amount) {
      if (amount === undefined || amount === null) return '0 ₫';
      return new Intl.NumberFormat('vi-VN', {
        style: 'currency',
        currency: 'VND',
        maximumFractionDigits: 0
      }).format(amount);
    }

    // Định dạng thời gian hh:mm:ss
    function formatTime(totalSeconds) {
      if (!totalSeconds || totalSeconds <= 0) return '00:00:00';
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = Math.floor(totalSeconds % 60);
      const pad = (n) => n.toString().padStart(2, '0');
      return `${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    // =========================================================================
    // COMPONENT BẢN ĐỒ ĐOẠN ĐƯỜNG ĐÃ DI CHUYỂN TRÊN HOÁ ĐƠN
    // =========================================================================
    function InvoiceMiniMap({ pathCoords, currentPos }) {
      const containerRef = useRef(null);
      const mapInstanceRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current) return;

        const defaultCenter = pathCoords && pathCoords.length > 0 
          ? [pathCoords[0].lat, pathCoords[0].lng] 
          : (currentPos ? [currentPos.lat, currentPos.lng] : [21.0285, 105.8542]);

        const map = L.map(containerRef.current, {
          center: defaultCenter,
          zoom: 15,
          zoomControl: false,
          attributionControl: false,
          scrollWheelZoom: false,
          dragging: true,
        });

        // Layer Google Maps sắc nét, rõ tên đường
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
          maxZoom: 20
        }).addTo(map);

        if (pathCoords && pathCoords.length > 0) {
          const latLngs = pathCoords.map(p => [p.lat, p.lng]);

          // Đường vẽ lộ trình xanh ngọc
          const polyline = L.polyline(latLngs, {
            color: '#06b6d4',
            weight: 4.5,
            opacity: 0.95,
            lineCap: 'round',
            lineJoin: 'round'
          }).addTo(map);

          // Điểm A (Khởi hành)
          const startPt = latLngs[0];
          const startIcon = L.divIcon({
            className: 'start-marker',
            html: `
              <div style="background-color: #10b981; color: white; border-radius: 9999px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.5);">
                A
              </div>
            `,
            iconSize: [24, 24],
            iconAnchor: [12, 12]
          });
          L.marker(startPt, { icon: startIcon }).addTo(map);

          // Điểm B (Kết thúc) nếu có từ 2 điểm
          if (latLngs.length > 1) {
            const endPt = latLngs[latLngs.length - 1];
            const endIcon = L.divIcon({
              className: 'end-marker',
              html: `
                <div style="background-color: #ef4444; color: white; border-radius: 9999px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.5);">
                  B
                </div>
              `,
              iconSize: [24, 24],
              iconAnchor: [12, 12]
            });
            L.marker(endPt, { icon: endIcon }).addTo(map);

            map.fitBounds(polyline.getBounds(), { padding: [25, 25], maxZoom: 17 });
          } else {
            map.setView(startPt, 16);
          }
        }

        mapInstanceRef.current = map;

        // Tự động căn chỉnh kích thước khi modal hiển thị xong
        const timer = setTimeout(() => {
          map.invalidateSize();
          if (pathCoords && pathCoords.length > 1) {
            const polyline = L.polyline(pathCoords.map(p => [p.lat, p.lng]));
            map.fitBounds(polyline.getBounds(), { padding: [25, 25], maxZoom: 17 });
          }
        }, 300);

        return () => {
          clearTimeout(timer);
          map.remove();
          mapInstanceRef.current = null;
        };
      }, [pathCoords]);

      return (
        <div className="space-y-1.5 my-3">
          <div className="flex items-center justify-between text-xs text-slate-300 font-semibold">
            <span className="flex items-center gap-1.5 text-cyan-400">
              <Icons.Route /> Bản đồ đoạn đường đã di chuyển
            </span>
            <span className="text-[11px] font-normal text-slate-400 bg-slate-800 px-2 py-0.5 rounded-full border border-slate-700">
              {pathCoords && pathCoords.length > 1 ? `${pathCoords.length} toạ độ GPS` : 'Vị trí hiện tại'}
            </span>
          </div>
          <div 
            ref={containerRef} 
            className="w-full h-44 sm:h-52 rounded-2xl overflow-hidden border border-slate-700/80 shadow-inner bg-slate-950 relative z-10"
          />
        </div>
      );
    }

                      {/* Cột phải: Tổng tiền & Nút thao tác */}
                      <div className="flex items-center justify-between sm:justify-end gap-3 w-full sm:w-auto pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-700/60">
                        <div className="text-left sm:text-right">
                          <span className="text-[10px] uppercase text-slate-400 block">Tổng tiền</span>
                          <span className="text-base sm:text-lg font-black text-emerald-400 font-mono leading-tight block">
                            {t.total_fare_formatted || formatVND(t.total_fare)}
                          </span>
                        </div>

                        <div className="flex items-center gap-1.5 ml-2">
                          <button
                            onClick={() => onViewInvoice(t)}
                            title="Xem lại biên lai chi tiết"
                            className="flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium transition-all"
                          >
                            <Icons.FileText />
                            <span className="hidden md:inline">Biên lai</span>
                          </button>
                          {t.img && (
                            <button
                              onClick={() => {
                                const a = document.createElement('a');
                                a.href = t.img;
                                a.download = `lo-trinh-chuyen-${t.stt || idx + 1}.png`;
                                a.click();
                              }}
                              title="Tải ảnh lộ trình"
                              className="p-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 hover:text-white transition-all"
                            >
                              <Icons.Download />
                            </button>
                          )}
                          <button
                            onClick={() => onDeleteTrip(t)}
                            title="Xoá chuyến đi này"
                            className="p-1.5 rounded-lg bg-slate-700/50 hover:bg-red-900/60 text-slate-400 hover:text-red-300 transition-all"
                          >
                            <Icons.Trash />
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Footer */}
            <div className="p-4 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-xs text-slate-400">
              <span className="flex items-center gap-1.5 text-[11px]">
                <Icons.CloudCheck /> Dữ liệu được đồng bộ trực tiếp với Google Firebase
              </span>
              <button
                onClick={onClose}
                className="px-5 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-semibold text-xs transition-all"
              >
                Đóng
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Modal phóng to ảnh lộ trình
    function ImagePreviewModal({ src, onClose, title = "Ảnh lộ trình di chuyển" }) {
      if (!src) return null;
      return (
        <div className="fixed inset-0 z-[99999] flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
          <div className="relative max-w-2xl w-full bg-slate-900 border border-slate-700 rounded-3xl overflow-hidden shadow-2xl flex flex-col">
            <div className="p-4 bg-slate-800 flex items-center justify-between border-b border-slate-700">
              <h3 className="text-sm font-bold text-white flex items-center gap-2">
                <Icons.Route /> {title}
              </h3>
              <div className="flex items-center gap-2">
                <a
                  href={src}
                  download="lo-trinh-gps.png"
                  className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition-all"
                >
                  <Icons.Download /> Tải ảnh về
                </a>
                <button
                  onClick={onClose}
                  className="p-1.5 rounded-xl bg-slate-700 text-slate-400 hover:text-white"
                >
                  <Icons.Close />
                </button>
              </div>
            </div>
            <div className="p-4 bg-slate-950 flex items-center justify-center">
              <img src={src} alt="Snapshot lộ trình" className="w-full max-h-[70vh] object-contain rounded-xl shadow-lg border border-slate-800" />
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 4. MAIN APPLICATION COMPONENT
    // =========================================================================
    function App() {
      const [pricing, setPricing] = useState(DEFAULT_PRICING);
      const [selectedVehicle, setSelectedVehicle] = useState('xanh_sm');
      const [tripStatus, setTripStatus] = useState('idle'); // 'idle' | 'running' | 'paused' | 'finished'

      // Metrics
      const [currentPos, setCurrentPos] = useState({ lat: 21.028511, lng: 105.854167, accuracy: 10 });
      const [pathCoords, setPathCoords] = useState([]);
      const [rawDistanceKm, setRawDistanceKm] = useState(0.0);
      const [steppedDistanceKm, setSteppedDistanceKm] = useState(0.0);
      const [totalFare, setTotalFare] = useState(() => DEFAULT_PRICING.vehicles.xanh_sm.base_fare);
      const [fareResult, setFareResult] = useState(() => calculateFare(0, 'xanh_sm', DEFAULT_PRICING));
      const [durationSeconds, setDurationSeconds] = useState(0);
      const [currentSpeedKmh, setCurrentSpeedKmh] = useState(0);

      const [gpsStatus, setGpsStatus] = useState('Đang khởi tạo GPS...');
      
      // Thời gian
      const [startTime, setStartTime] = useState(null);
      const [endTime, setEndTime] = useState(null);

      // Modals
      const [showConfirmFinish, setShowConfirmFinish] = useState(false);
      const [showInvoice, setShowInvoice] = useState(false);
      const [showPricingModal, setShowPricingModal] = useState(false);
      const [showHistoryModal, setShowHistoryModal] = useState(false);
      const [savedTrips, setSavedTrips] = useState([]);
      const [historyLoading, setHistoryLoading] = useState(false);
      const [previewImg, setPreviewImg] = useState(null);
      const [currentTripStt, setCurrentTripStt] = useState(null);
      const [savingStatus, setSavingStatus] = useState(null);
      const [lastRouteImg, setLastRouteImg] = useState(null);
      const [firebaseError, setFirebaseError] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);

      // Refs
      const mapContainerRef = useRef(null);
      const mapRef = useRef(null);
      const polylineRef = useRef(null);
      const currentMarkerRef = useRef(null);
      const startMarkerRef = useRef(null);
      const watchIdRef = useRef(null);
      const timerRef = useRef(null);

      // Quản lý thời gian thực tuyệt đối bằng Timestamp (chống lag/ngừng khi ra màn hình chính)
      const startTimeRef = useRef(null);
      const pausedTimeAccumRef = useRef(0);
      const pauseStartRef = useRef(null);
      
      // Quản lý chống tắt màn hình (Screen Wake Lock API) & chạy ngầm
      const wakeLockRef = useRef(null);
      const [wakeLockActive, setWakeLockActive] = useState(false);
      const audioCtxRef = useRef(null);

      const requestWakeLock = async () => {
        try {
          if ('wakeLock' in navigator) {
            wakeLockRef.current = await navigator.wakeLock.request('screen');
            setWakeLockActive(true);
            wakeLockRef.current.addEventListener('release', () => {
              setWakeLockActive(false);
              wakeLockRef.current = null;
            });
          }
        } catch (e) {
          console.warn("Screen WakeLock không khả dụng:", e);
        }
      };

      const releaseWakeLock = () => {
        if (wakeLockRef.current) {
          wakeLockRef.current.release().catch(() => {});
          wakeLockRef.current = null;
          setWakeLockActive(false);
        }
      };

      const startSilentAudio = () => {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          if (!audioCtxRef.current) {
            audioCtxRef.current = new AudioCtx();
          }
          if (audioCtxRef.current.state === 'suspended') {
            audioCtxRef.current.resume();
          }
          // Âm thanh tần số siêu thấp không nghe thấy để ngăn trình duyệt ngủ đông
          const osc = audioCtxRef.current.createOscillator();
          const gain = audioCtxRef.current.createGain();
          gain.gain.value = 0.00001;
          osc.connect(gain);
          gain.connect(audioCtxRef.current.destination);
          osc.start();
        } catch (e) {
          console.warn("Audio keep-alive error:", e);
        }
      };

      const stopSilentAudio = () => {
        try {
          if (audioCtxRef.current) {
            audioCtxRef.current.close().catch(() => {});
            audioCtxRef.current = null;
          }
        } catch (e) {}
      };

      // --- Khởi tạo Bản đồ Leaflet ---
      useEffect(() => {
        if (!mapContainerRef.current) return;

        const map = L.map(mapContainerRef.current, {
          center: [currentPos.lat, currentPos.lng],
          zoom: 16,
          zoomControl: false,
        });

        // Các nguồn bản đồ chất lượng cao, miễn phí và không bị chặn 403
        const baseMaps = {
          "Google Maps": L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '&copy; Google Maps'
          }),
          "Bản đồ Voyager (OSM)": L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd',
            maxZoom: 20,
            attribution: '&copy; CARTO &copy; OpenStreetMap'
          }),
          "Ảnh Vệ Tinh": L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '&copy; Google Satellite'
          })
        };

        // Kích hoạt mặc định Google Maps (rõ nét đường phố Việt Nam)
        baseMaps["Google Maps"].addTo(map);

        // Menu chuyển đổi kiểu bản đồ ở góc trên phải
        L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Đường vẽ lộ trình xanh ngọc
        const polyline = L.polyline([], {
          color: '#06b6d4',
          weight: 5,
          opacity: 0.9,
          lineCap: 'round',
          lineJoin: 'round',
        }).addTo(map);

        mapRef.current = map;
        polylineRef.current = polyline;

        return () => {
          map.remove();
          mapRef.current = null;
        };
      }, []);

      // Cập nhật Marker vị trí hiện tại
      useEffect(() => {
        const map = mapRef.current;
        if (!map || !currentPos) return;

        const latLng = [currentPos.lat, currentPos.lng];

        if (!currentMarkerRef.current) {
          const pulseIcon = L.divIcon({
            className: 'gps-pulse-marker',
            html: '<div class="pulse-ring"></div><div class="core-dot"></div>',
            iconSize: [44, 44],
            iconAnchor: [22, 22],
          });
          currentMarkerRef.current = L.marker(latLng, { icon: pulseIcon }).addTo(map);
          map.setView(latLng, 16);
        } else {
          currentMarkerRef.current.setLatLng(latLng);
        }
      }, [currentPos]);

      // Cập nhật Marker điểm xuất phát
      useEffect(() => {
        const map = mapRef.current;
        if (!map) return;

        if (pathCoords.length > 0) {
          const startPt = pathCoords[0];
          const latLng = [startPt.lat, startPt.lng];

          if (!startMarkerRef.current) {
            const startIcon = L.divIcon({
              className: 'start-marker',
              html: `
                <div style="background-color: #10b981; color: white; border-radius: 9999px; padding: 4px; border: 2px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; width: 28px; height: 28px;">
                  <span style="font-size: 12px; font-weight: 800;">A</span>
                </div>
              `,
              iconSize: [28, 28],
              iconAnchor: [14, 14],
            });
            startMarkerRef.current = L.marker(latLng, { icon: startIcon }).addTo(map);
          }
        } else {
          if (startMarkerRef.current) {
            startMarkerRef.current.remove();
            startMarkerRef.current = null;
          }
        }
      }, [pathCoords]);

      // Cập nhật đường vẽ lộ trình
      useEffect(() => {
        if (!polylineRef.current) return;
        polylineRef.current.setLatLngs(pathCoords.map(p => [p.lat, p.lng]));
      }, [pathCoords]);

      // Lấy GPS ban đầu
      useEffect(() => {
        if ('geolocation' in navigator) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const { latitude, longitude, accuracy } = pos.coords;
              const pt = { lat: latitude, lng: longitude, accuracy };
              setCurrentPos(pt);
              setGpsStatus(`GPS sẵn sàng (±${Math.round(accuracy)}m)`);
              if (mapRef.current) {
                mapRef.current.setView([latitude, longitude], 16);
              }
            },
            (err) => {
              setGpsStatus('GPS không phản hồi (Dùng toạ độ mặc định)');
            },
            { enableHighAccuracy: true, timeout: 8000 }
          );
        }
      }, []);

      // Đồng hồ bấm giờ chuẩn xác theo Timestamp (Không bao giờ bị lệch hay ngưng khi ra màn hình chính)
      useEffect(() => {
        if (tripStatus === 'running') {
          const updateClock = () => {
            if (!startTimeRef.current) return;
            const now = Date.now();
            const elapsed = Math.floor((now - startTimeRef.current - pausedTimeAccumRef.current) / 1000);
            setDurationSeconds(Math.max(0, elapsed));
          };

          updateClock();
          timerRef.current = setInterval(updateClock, 1000);
        } else {
          if (timerRef.current) clearInterval(timerRef.current);
        }
        return () => {
          if (timerRef.current) clearInterval(timerRef.current);
        };
      }, [tripStatus]);

      // Xử lý sự kiện khi người dùng thoát ra màn hình chính và quay trở lại (Page Visibility API)
      useEffect(() => {
        const handleVisibilityChange = () => {
          if (document.visibilityState === 'visible') {
            // Khi người dùng mở lại trang từ màn hình chính:
            if (tripStatus === 'running' && startTimeRef.current) {
              const now = Date.now();
              const elapsed = Math.floor((now - startTimeRef.current - pausedTimeAccumRef.current) / 1000);
              setDurationSeconds(Math.max(0, elapsed));
              // Lấy lại quyền giữ sáng màn hình nếu bị trình duyệt nhả ra
              requestWakeLock();
              // Lấy lại vị trí GPS mới nhất
              if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                  (pos) => {
                    const { latitude, longitude, accuracy } = pos.coords;
                    if (accuracy <= 35) {
                      setCurrentPos({ lat: latitude, lng: longitude, accuracy });
                    }
                  },
                  () => {},
                  { enableHighAccuracy: true, timeout: 5000 }
                );
              }
            }
          }
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);
        window.addEventListener('focus', handleVisibilityChange);
        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          window.removeEventListener('focus', handleVisibilityChange);
        };
      }, [tripStatus]);

      // Tính tiền cước tự động ngay tại JS khi quãng đường hoặc loại xe thay đổi
      useEffect(() => {
        const result = calculateFare(rawDistanceKm, selectedVehicle, pricing);
        setSteppedDistanceKm(result.steppedDistanceKm);
        setTotalFare(result.totalFare);
        setFareResult(result);
      }, [rawDistanceKm, selectedVehicle, pricing]);

      // GPS Watcher khi di chuyển thật trên đường (Lọc nhiễu & Chống nhảy toạ độ khi thức dậy)
      useEffect(() => {
        if (tripStatus === 'running') {
          if (!('geolocation' in navigator)) {
            alert('Trình duyệt không hỗ trợ Geolocation!');
            return;
          }

          watchIdRef.current = navigator.geolocation.watchPosition(
            (pos) => {
              const { latitude, longitude, accuracy, speed } = pos.coords;
              const newPt = {
                lat: latitude,
                lng: longitude,
                accuracy: accuracy || 10,
                timestamp: pos.timestamp || Date.now(),
                speed: speed || 0
              };

              setCurrentPos(newPt);
              setGpsStatus(`GPS hoạt động (±${Math.round(accuracy || 0)}m)`);
              if (speed && speed > 0) setCurrentSpeedKmh(speed * 3.6);

              if (mapRef.current) {
                mapRef.current.panTo([latitude, longitude], { animate: true });
              }

              setPathCoords((prev) => {
                if (prev.length === 0) return [newPt];
                const last = prev[prev.length - 1];

                // 1. Kiểm tra độ chính xác GPS: bỏ qua điểm nếu sai số quá lớn (> 35m)
                if (accuracy && accuracy > 35) {
                  return prev;
                }

                // 2. Bỏ qua toạ độ cũ từ cache trình duyệt (stale timestamp)
                if (newPt.timestamp && last.timestamp && newPt.timestamp <= last.timestamp) {
                  return prev;
                }

                const distKm = haversineDistance(last.lat, last.lng, newPt.lat, newPt.lng);
                const distMeters = distKm * 1000;

                // 3. Lọc rung lắc khi xe dừng (< 3m)
                if (distMeters < 3) {
                  return prev;
                }

                // 4. Lọc nhảy vọt GPS phi lý do máy vừa bật lại từ chế độ ngủ (> 150 km/h)
                const elapsedSec = (newPt.timestamp - last.timestamp) / 1000;
                if (elapsedSec > 0) {
                  const calculatedSpeedKmh = (distKm / (elapsedSec / 3600));
                  if (calculatedSpeedKmh > 150) {
                    console.warn(`Lọc toạ độ giật phi lý: ${calculatedSpeedKmh.toFixed(0)} km/h`);
                    return prev;
                  }
                }

                setRawDistanceKm((d) => d + distKm);
                return [...prev, newPt];
              });
            },
            (err) => {
              setGpsStatus(`Lỗi GPS: ${err.message}`);
            },
            { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
          );
        } else {
          if (watchIdRef.current !== null) {
            navigator.geolocation.clearWatch(watchIdRef.current);
            watchIdRef.current = null;
          }
        }
        return () => {
          if (watchIdRef.current !== null) {
            navigator.geolocation.clearWatch(watchIdRef.current);
            watchIdRef.current = null;
          }
        };
      }, [tripStatus]);

      // Tự động tải lịch sử chuyến đi khi mở ứng dụng
      useEffect(() => {
        loadSavedTrips();
      }, []);

      const loadSavedTrips = async () => {
        setHistoryLoading(true);
        try {
          const res = await fetchTripsFromDb();
          const list = res.trips || res;
          setSavedTrips(list);
          if (res.firebaseError) {
            setFirebaseError(res.firebaseError);
          } else {
            setFirebaseError(null);
          }
        } catch (e) {
          console.warn("Lỗi tải chuyến đi:", e);
        } finally {
          setHistoryLoading(false);
        }
      };

      const handleSyncAll = async () => {
        setIsSyncing(true);
        try {
          const res = await syncLocalTripsToFirebase();
          if (res.synced > 0) {
            alert(`🎉 Đồng bộ thành công ${res.synced} chuyến đi lên Firebase Cloud!`);
            setSavedTrips(res.trips);
            setFirebaseError(null);
          } else {
            alert("Tất cả chuyến đi đều đã được lưu trên Firebase Cloud!");
            setFirebaseError(null);
          }
        } catch (err) {
          alert(`❌ Lỗi khi đồng bộ: ${err.message}\n\nHãy đảm bảo bạn đã đổi Rules trên Firebase Console thành 'allow read, write: if true;' và bấm Publish nhé!`);
          setFirebaseError('permission-denied');
        } finally {
          setIsSyncing(false);
        }
      };

      const handleDeleteTrip = async (trip) => {
        if (!confirm(`Bạn có chắc muốn xoá chuyến đi #${trip.stt}?`)) return;
        await deleteTripFromDb(trip);
        setSavedTrips(prev => prev.filter(t => {
          if (trip.id && t.id === trip.id) return false;
          if (trip.stt && t.stt === trip.stt) return false;
          return true;
        }));
      };

      const handleViewPastTripInvoice = (trip) => {
        setFareResult({
          vehicleName: trip.vehicle_name || 'Taxi Xanh SM',
          rawDistanceKm: trip.raw_distance || trip.distance,
          steppedDistanceKm: trip.distance,
          totalFare: trip.total_fare,
          breakdown: trip.breakdown || [
            {
              stepName: `Quãng đường di chuyển`,
              distanceKm: trip.distance,
              rate: 0,
              unit: '',
              subtotal: trip.total_fare
            }
          ]
        });
        setDurationSeconds(trip.duration_seconds || 0);
        setCurrentTripStt(trip.stt);
        setLastRouteImg(trip.img || null);
        setSavingStatus(`Chuyến đi #${trip.stt} (Đã lưu Firebase)`);
        setShowHistoryModal(false);
        setShowInvoice(true);
      };

      // Điều khiển chuyến đi
      const handleStart = () => {
        const now = Date.now();
        startTimeRef.current = now;
        pausedTimeAccumRef.current = 0;
        pauseStartRef.current = null;

        setStartTime(new Date(now));
        setEndTime(null);
        setTripStatus('running');
        setRawDistanceKm(0.0);
        setSteppedDistanceKm(0.0);
        const base = pricing.vehicles[selectedVehicle]?.base_fare || 30500;
        setTotalFare(base);
        setFareResult(calculateFare(0, selectedVehicle, pricing));
        setDurationSeconds(0);
        setPathCoords([currentPos]);
        setLastRouteImg(null);
        setSavingStatus(null);

        // Kích hoạt chống tắt màn hình và giữ tiến trình chạy ngầm
        requestWakeLock();
        startSilentAudio();
      };

      const handlePause = () => {
        pauseStartRef.current = Date.now();
        setTripStatus('paused');
        setCurrentSpeedKmh(0);
        releaseWakeLock();
        stopSilentAudio();
      };

      const handleResume = () => {
        if (pauseStartRef.current) {
          pausedTimeAccumRef.current += (Date.now() - pauseStartRef.current);
          pauseStartRef.current = null;
        }
        setTripStatus('running');
        requestWakeLock();
        startSilentAudio();
      };

      const handleFinish = async () => {
        setShowConfirmFinish(false);
        const finishTime = new Date();
        setEndTime(finishTime);
        setTripStatus('finished');
        setCurrentSpeedKmh(0);
        releaseWakeLock();
        stopSilentAudio();

        // Tính cước hoá đơn chính thức
        const finalFare = calculateFare(rawDistanceKm, selectedVehicle, pricing);
        setFareResult(finalFare);
        setTotalFare(finalFare.totalFare);

        // Tạo ảnh snapshot lộ trình từ Canvas (img)
        const routeSnapshot = generateRouteSnapshot(pathCoords, 540, 320, {
          distance: finalFare.steppedDistanceKm,
          totalFareFormatted: formatVND(finalFare.totalFare)
        });
        setLastRouteImg(routeSnapshot);

        // Tính số thứ tự STT tiếp theo (lớn hơn STT lớn nhất hiện có)
        const currentMaxStt = savedTrips.reduce((max, t) => Math.max(max, Number(t.stt) || 0), 0);

        setCurrentTripStt(nextStt);

          duration_seconds: durationSeconds,
          duration_formatted: formatTime(durationSeconds),
          breakdown: finalFare.breakdown
        };

        setShowInvoice(true);

        try {
          const res = await saveTripToDb(tripRecord);
          if (res.from === 'firebase') {
            setSavingStatus(`Đã lưu thành công vào Firebase (Chuyến #${nextStt})`);
            setFirebaseError(null);
          } else {
            setSavingStatus(`Đã lưu vào bộ nhớ máy (Chuyến #${nextStt})`);
            if (res.code === 'permission-denied') {
              setFirebaseError('permission-denied');
            }
          }
          setSavedTrips(prev => [tripRecord, ...prev.filter(t => t.stt !== nextStt)]);
        } catch (err) {
          console.error("Lỗi khi lưu chuyến đi:", err);

        setSteppedDistanceKm(0.0);

        setDurationSeconds(0);

        setEndTime(null);

                    </div>
                  ) : null}

                  {/* Chi tiết từng bậc tính cước */}
                  <div>
                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                      Chi tiết các bậc tính tiền
                    </h3>
                    <div className="border border-slate-700 rounded-2xl overflow-hidden divide-y divide-slate-800 text-xs">
                      {fareResult.breakdown.map((item, idx) => (
                        <div key={idx} className="p-3 bg-slate-800/40 flex items-center justify-between">
                          <div>
                            <p className="font-semibold text-slate-100">{item.stepName}</p>
                            <p className="text-slate-400 text-[11px]">
                              {item.distanceKm} km × {formatVND(item.rate)}
                            </p>
                          </div>
                          <span className="font-bold text-slate-200 font-mono text-sm">
                            {formatVND(item.subtotal)}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>

                {/* Footer: Tổng cước thanh toán nằm ở phần ngoài, cùng cấp với nút bấm */}
                <div className="p-4 sm:p-5 bg-slate-800/95 border-t border-slate-700 flex flex-wrap items-center justify-between gap-3 shadow-lg">
                  {/* Bên trái: Tổng cước thanh toán */}
                  <div className="flex flex-col">
                    <span className="text-[11px] text-emerald-400 font-bold uppercase tracking-wider">
                      Tổng cước thanh toán
                    </span>
                    <span className="text-2xl sm:text-3xl font-black text-emerald-400 font-mono tracking-tight leading-none mt-1">
                      {formatVND(fareResult.totalFare)}
                    </span>
                    <span className="text-[10px] text-slate-400 mt-0.5">
                      Đã bao gồm thuế & cước bậc thang
                    </span>
                  </div>

                  {/* Bên phải: Cụm nút In biên lai & Đóng (ẩn khi in) */}
                  <div className="no-print flex items-center gap-2.5 ml-auto">
                    <button
                      onClick={() => window.print()}
                      className="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 hover:text-white font-semibold text-xs transition-all shadow-md active:scale-95"
                    >
                      <Icons.Printer />
                      <span>In biên lai</span>
                    </button>
                    <button
                      onClick={() => setShowInvoice(false)}
                      className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs transition-all shadow-lg shadow-emerald-950/40 active:scale-95"
                    >
                      Đóng
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* MODAL BẢNG GIÁ NIÊM YẾT */}
          {/* ================================================================= */}
          {showPricingModal && (
            <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="relative w-full max-w-2xl bg-slate-900 border border-slate-700 rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                <div className="p-6 bg-slate-800 border-b border-slate-700 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="p-2.5 rounded-2xl bg-cyan-500/10 text-cyan-400">
                      <Icons.FileText />
                    </div>
                    <div>
                      <h2 className="text-lg font-bold text-white">BẢNG GIÁ CƯỚC NIÊM YẾT</h2>
                      <p className="text-xs text-slate-400">
                        Cấu hình quy chuẩn bước nhảy: {pricing.step_km} km (100 mét)
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowPricingModal(false)}
                    className="p-2 rounded-xl bg-slate-700/60 hover:bg-slate-700 text-slate-400 hover:text-white transition-all"
                  >
                    <Icons.Close />
                  </button>
                </div>

                <div className="p-6 overflow-y-auto space-y-4 text-slate-200">
                  <div className="p-3.5 rounded-xl bg-cyan-950/20 border border-cyan-800/40 text-xs text-cyan-200 leading-relaxed">
                    💡 <b>Quy tắc tính toán:</b> Quãng đường GPS thực tế sau khi lọc nhiễu sẽ được làm tròn theo 
                    bước nhảy <b>{pricing.step_km} km</b>, sau đó tính tiền lũy tiến theo từng bậc cước bên dưới.
                  </div>

                  <div className="space-y-4">
                    {Object.entries(pricing.vehicles).map(([k, v]) => (
                      <div key={k} className="p-4 rounded-2xl bg-slate-800/60 border border-slate-700">
                        <div className="flex items-center justify-between mb-3">
                          <div>
                            <h3 className="text-base font-bold text-white">{v.name}</h3>
                            <p className="text-xs text-slate-400">{v.description}</p>
                          </div>
                          <span className="text-xs px-2.5 py-1 rounded-full bg-slate-700 font-semibold text-emerald-400">
                            Mở cửa: {formatVND(v.base_fare)} / {v.base_distance_km} km
                          </span>
                        </div>

                        <div className="border border-slate-700 rounded-xl overflow-hidden divide-y divide-slate-800 text-xs">
                          <div className="p-2.5 bg-slate-800 font-semibold text-slate-300 flex justify-between">
                            <span>Mốc khoảng cách</span>
                            <span>Đơn giá</span>
                          </div>
                          <div className="p-2.5 bg-slate-900/40 flex justify-between text-slate-300">
                            <span>0 đến {v.base_distance_km} km đầu tiên</span>
                            <span className="font-mono text-emerald-400">{formatVND(v.base_fare)} (Trọn gói)</span>
                          </div>
                          {v.tiers.map((t, idx) => (
                            <div key={idx} className="p-2.5 bg-slate-900/20 flex justify-between text-slate-300">
                              <span>{t.description}</span>
                              <span className="font-mono text-cyan-300">{formatVND(t.price_per_km)}/km</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="p-4 bg-slate-800 border-t border-slate-700 flex justify-end">
                  <button
                    onClick={() => setShowPricingModal(false)}
                    className="px-5 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-semibold text-xs transition-all"
                  >
                    Đóng
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* MODAL LỊCH SỬ CÁC CHUYẾN ĐI (FIREBASE FIRESTORE) */}
          {/* ================================================================= */}
          <HistoryModal
            isOpen={showHistoryModal}
            onClose={() => setShowHistoryModal(false)}
            trips={savedTrips}
            loading={historyLoading}
            onRefresh={loadSavedTrips}
            onDeleteTrip={handleDeleteTrip}
            onViewInvoice={handleViewPastTripInvoice}
            onPreviewImage={(src) => setPreviewImg(src)}
            firebaseError={firebaseError}
            onSyncAll={handleSyncAll}
            isSyncing={isSyncing}
          />

          {/* ================================================================= */}
          {/* MODAL PHÓNG TO ẢNH LỘ TRÌNH */}
          {/* ================================================================= */}
          <ImagePreviewModal
            src={previewImg}
            onClose={() => setPreviewImg(null)}
          />
        </div>
      );
    }

    // Render App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
